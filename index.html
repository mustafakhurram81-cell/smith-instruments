<body>
  <div id="root"></div>

  <!-- Google Translate Widget -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,de,es,zh-CN,fr,pt,ar,ru,ja,ko',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" async
    src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <!-- Hide ALL Google Translate branding -->
  <style>
    /* Hide top banner */
    .goog-te-banner-frame,
    .skiptranslate {
      display: none !important;
    }

    body {
      top: 0 !important;
      position: static !important;
    }

    /* Hide widget completely - we use custom UI */
    #google_translate_element {
      position: absolute !important;
      left: -9999px !important;
      visibility: hidden !important;
    }

    /* Hide popup tooltip on hover */
    .goog-te-balloon-frame,
    #goog-gt-tt,
    .goog-tooltip {
      display: none !important;
    }

    /* Remove highlight on translated text */
    .goog-text-highlight {
      background: none !important;
      box-shadow: none !important;
    }

    /* Hide "Powered by Google" */
    .goog-logo-link,
    .goog-te-gadget span {
      display: none !important;
    }

    .VIpgJd-ZVi9od-l4eHX-hSRGPd,
    .VIpgJd-ZVi9od-aZ2wEe-wOHMyf {
      display: none !important;
    }

    /* Fix body positioning after translation */
    html.translated-ltr body,
    html.translated-rtl body {
      top: 0 !important;
    }
  </style>
</body>
